name: CI

# Two compiler lanes:
# - floor: the `gleam` requirement in gleam.toml (keep both in sync). It proves the
#   declared minimum still builds and passes the tests, on every OTP it supports.
# - latest: floats on 1.x so new compiler warnings, deprecations and formatter changes
#   surface here first. Format, lint and the release workflow use this lane.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          gleam-version: "1.x"
      - run: gleam format --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          gleam-version: "1.x"
      - run: gleam deps download
      - run: gleam run -m glinter
      - run: gleam build --warnings-as-errors
      - name: Verify examples compile
        run: |
          trap 'rm -f src/yabase/example_*.gleam' EXIT
          for f in examples/*.gleam; do
            mod=$(basename "$f" .gleam)
            cp "$f" "src/yabase/example_${mod}.gleam"
          done
          gleam build
      - name: Verify README snippets compile
        run: bash scripts/verify-readme.sh

  test:
    name: Test (OTP ${{ matrix.otp }} / Gleam ${{ matrix.gleam }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: "26"
            gleam: "1.15.0"
          - otp: "27"
            gleam: "1.15.0"
          - otp: "28"
            gleam: "1.15.0"
          - otp: "29"
            gleam: "1.x"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: ${{ matrix.gleam }}
      - run: gleam deps download
      - run: gleam test

  test-javascript:
    # Two lanes:
    #   - "18" is the documented minimum supported Node version (see README).
    #     Failures here mean we have to either fix the code or update the
    #     stated support floor — they must not be silently dropped.
    #   - "lts/*" is the current LTS for general confidence.
    name: Test (JavaScript / Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - "18"
          - "lts/*"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          gleam-version: "1.x"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: gleam deps download
      - run: gleam build --target javascript
      - run: gleam test --target javascript
